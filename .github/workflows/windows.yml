name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Windows (MSVC 2022)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Conan
        run: pip install "conan>=2.0,<3"

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-conan-${{ hashFiles('conanfile.txt') }}
          restore-keys: ${{ runner.os }}-conan-

      - name: Install dependencies
        shell: bash
        run: mkdir -p build && cd build && conan install .. --build=missing -pr:b=default -s build_type=Release

      # On Windows, cmake_layout uses a multi-config generator (Visual Studio).
      # Generators land in build/generators/ (no build_type subdirectory).
      # Keep WARNINGS_AS_ERRORS=OFF to avoid MSVC warning noise from third-party headers.
      # Use shell: bash throughout to avoid PowerShell backtick line-continuation
      # splitting cmake arguments (e.g. conan_toolchain.cmake → conan_toolchain + .cmake).
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=build/generators/conan_toolchain.cmake \
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW \
            -DXMLJSON_WARNINGS_AS_ERRORS=OFF

      - name: Build
        shell: bash
        run: cmake --build build --config Release

      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure -C Release
