name: Static Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  clang-tidy:
    name: clang-tidy (advisory)
    runs-on: ubuntu-22.04
    continue-on-error: true # Advisory for initial rollout; can be made gating later.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make clang clang-tidy

      - name: Install Conan
        run: pip install "conan>=2.0,<3"

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-conan-${{ hashFiles('conanfile.txt') }}
          restore-keys: ${{ runner.os }}-conan-

      - name: Install dependencies
        run: mkdir -p build && cd build && conan install .. --build=missing -pr:b=default -s build_type=Release

      - name: Configure with compile commands
        run: |
          cmake -S . -B build/Release \
            -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DXMLJSON_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy on project sources
        run: |
          if [ -f .clang-tidy ]; then
            clang-tidy lib/src/*.cpp app/main.cpp tests/*.cpp -p build/Release
          else
            clang-tidy lib/src/*.cpp app/main.cpp tests/*.cpp -p build/Release -checks='-*,modernize-*,readability-*,bugprone-*,clang-analyzer-*,-modernize-use-trailing-return-type,-readability-magic-numbers,-readability-identifier-length'
          fi

  cppcheck:
    name: cppcheck (advisory)
    runs-on: ubuntu-22.04
    continue-on-error: true # Advisory for initial rollout; can be made gating later.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability --error-exitcode=1 --suppress=missingIncludeSystem --inline-suppr -I lib/include lib/src app tests
