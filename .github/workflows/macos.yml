name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: macOS (Apple Clang)
    # Intentionally tracks the newest macOS runner image; not pinned to macos-13.
    runs-on: macOS-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Conan
        # macos-latest ships an externally-managed Python (PEP 668); use pipx.
        run: |
          pipx install "conan>=2.0,<3"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-conan-${{ hashFiles('conanfile.txt') }}
          restore-keys: ${{ runner.os }}-conan-

      - name: Install dependencies
        run: mkdir -p build && cd build && conan install .. --build=missing -pr:b=default -s build_type=Release

      - name: Configure
        run: |
          cmake -S . -B build/Release \
            -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW \
            -DCMAKE_BUILD_TYPE=Release \
            -DXMLJSON_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build/Release

      - name: Test
        run: ctest --test-dir build/Release --output-on-failure
