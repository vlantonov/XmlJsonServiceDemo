name: Ubuntu CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Ubuntu (${{ matrix.compiler }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make

      - name: Install clang
        if: matrix.compiler == 'clang'
        run: sudo apt-get install -y clang

      - name: Install Conan
        run: pip install "conan>=2.0,<3"

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-conan-${{ hashFiles('conanfile.txt') }}
          restore-keys: ${{ runner.os }}-conan-

      - name: Install dependencies
        run: mkdir -p build && cd build && conan install .. --build=missing -pr:b=default -s build_type=Release

      - name: Configure
        run: |
          EXTRA=""
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            EXTRA="-DCMAKE_CXX_COMPILER=clang++"
          fi
          cmake -S . -B build/Release \
            -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW \
            -DCMAKE_BUILD_TYPE=Release \
            -DXMLJSON_WARNINGS_AS_ERRORS=ON \
            $EXTRA

      - name: Build
        run: cmake --build build/Release

      - name: Test
        run: ctest --test-dir build/Release --output-on-failure
