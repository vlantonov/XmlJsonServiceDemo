name: Sanitizers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sanitizer:
    name: ${{ matrix.sanitizer }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, ubsan]

    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: "detect_leaks=1:strict_string_checks=1"
      UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make clang

      - name: Install Conan
        run: pip install "conan>=2.0,<3"

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-conan-relwithdebinfo-${{ hashFiles('conanfile.txt') }}
          restore-keys: ${{ runner.os }}-conan-relwithdebinfo-

      - name: Install dependencies
        run: mkdir -p build && cd build && conan install .. --build=missing -pr:b=default -s build_type=RelWithDebInfo

      - name: Configure
        run: |
          if [ "${{ matrix.sanitizer }}" = "asan" ]; then
            SANITIZER_FLAG="-DXMLJSON_ENABLE_ASAN=ON"
          else
            SANITIZER_FLAG="-DXMLJSON_ENABLE_UBSAN=ON"
          fi
          cmake -S . -B build/RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE=build/RelWithDebInfo/generators/conan_toolchain.cmake \
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DXMLJSON_WARNINGS_AS_ERRORS=ON \
            "$SANITIZER_FLAG"

      - name: Build
        run: cmake --build build/RelWithDebInfo

      - name: Test
        run: ctest --test-dir build/RelWithDebInfo --output-on-failure
